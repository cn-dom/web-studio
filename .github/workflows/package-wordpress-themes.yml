name: Package PatriaSoul WordPress theme

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'patriasoul-theme/**'
      - '.github/workflows/package-wordpress-themes.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate and package theme
        run: |
          set -euo pipefail
          test -f patriasoul-theme/style.css
          test -f patriasoul-theme/functions.php
          php -l patriasoul-theme/functions.php
          php -l patriasoul-theme/front-page.php
          php -l patriasoul-theme/header.php
          php -l patriasoul-theme/footer.php
          php -l patriasoul-theme/index.php
          php -l patriasoul-theme/single.php
          php -l patriasoul-theme/page.php
          mkdir -p dist
          cd patriasoul-theme
          zip -r ../dist/patriasoul-theme.zip . -x '*.DS_Store' '*/.git/*'
      - name: Upload installable theme
        uses: actions/upload-artifact@v4
        with:
          name: patriasoul-wordpress-theme
          path: dist/patriasoul-theme.zip
          if-no-files-found: error
          retention-days: 30
